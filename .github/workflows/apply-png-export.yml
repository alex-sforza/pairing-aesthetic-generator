name: Publish Lily Dale Aesthetic Generator
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish generator
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          data = gzip.decompress(base64.b64decode(Path('lily-generator.gz.b64').read_text().strip())).decode('utf-8')
          Path('index.html').write_text(data, encoding='utf-8')
          Path('png-export.js').unlink(missing_ok=True)
          Path('lily-generator.gz.b64').unlink(missing_ok=True)
          PY
      - name: Commit published generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html png-export.js lily-generator.gz.b64
          git diff --cached --quiet || git commit -m "Publish Lily Dale aesthetic generator with PNG export"
          git push
